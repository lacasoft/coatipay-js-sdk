name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Instala @lacasoft/coatipay-protocol desde npm, igual que lo haría
      # cualquier persona que use el SDK. Requiere que el protocolo ya esté
      # publicado: hasta entonces este job no puede pasar.
      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Los vectores compartidos entre los SDK, de la ÚLTIMA versión publicada
      # del protocolo (no solo la del lockfile): un vector nuevo que este SDK
      # no cumpla hace fallar el CI aunque nadie haya subido la dependencia.
      - name: Shared vectors (latest published protocol)
        run: |
          npm pack @lacasoft/coatipay-protocol@latest --pack-destination "$RUNNER_TEMP" --silent > /dev/null
          tar -xzf "$RUNNER_TEMP"/lacasoft-coatipay-protocol-*.tgz -C "$RUNNER_TEMP"
          COATIPAY_VECTORES="$RUNNER_TEMP/package/vectors" npx vitest run src/__tests__/vectores.test.ts
